<p class="body" style="margin: 16px 0 0; color: var(--color-text-2);">Puedes agregar más perfiles después.</p>

<div class="{{barCls}}"><a class="{{ctaCls}}" href="{{rCta}}" aria-disabled="{{ctaDis}}" style="text-decoration: none;"><span class="tl-btn__label">Continuar</span></a></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"tema":{"editor":"enum","options":["light","dark"],"default":"light"},"fase":{"editor":"enum","options":["F1","F2"],"default":"F1"},"elegidas":{"editor":"text","default":""},"desplazar":{"editor":"text","default":"0"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const v = this._rv();
const P = ["ACT-02", "ACT-02-desplazado", "ACT-02-jorge", "AUTH-01", "AUTH-02", "AUTH-03", "AUTH-08", "AUTH-08-codigo", "CFG-01", "CFG-01-cerrar-sesion", "DET-01-empleo", "DET-01-turno", "DET-01-turno--f9", "DET-01-turno-postulado", "DET-02", "DET-02-exito", "DET-03", "EXP-01", "EXP-01-lista", "EXP-02", "EXP-02-turnos-desplazado", "EXP-02-turnos-desplazado--f9", "FALTA-ACT-02-matias", "FALTA-DET-01-pedro", "FALTA-INI-01-rosa", "FALTA-MSG-01-marta", "GES-01-turno", "GES-02-hogar", "GES-04", "GES-04-postulados", "GES-04-sin-postulados", "INDICE-F1", "INI-01-carolina", "INI-01-jorge-nuevo", "INI-01-salir", "INI-02", "INI-02--f7", "INI-02-cambio", "MSG-01", "MSG-01-jorge", "MSG-02", "MSG-02b-adjuntar", "MSG-02b-compartir", "MSG-02b-familia", "MSG-02b-marta", "MSG-02b-no-disponible", "MSG-02b-pedido", "Main", "Main--f9", "NOT-01", "ONB-01", "ONB-03", "ONB-99", "ONB-T1", "ONB-T2", "ONB-T3", "ONB-T4", "ONB-T5", "PRC-01", "PRC-01-hogar", "PRF-01", "PRF-01--f11", "PRF-01-final", "PRF-12", "PRF-12-avisado", "PRF-12-desde-act", "PUBL-01", "PUBL-01-carolina", "PUBL-03-paso1", "PUBL-03-paso2", "PUBL-03-paso3", "PUBL-03-paso4", "PUBL-04-identidad", "PUBL-04-paso1", "PUBL-04-paso2", "PUBL-04-paso3", "PUBL-04-paso4", "PUBL-04-paso5", "PUBL-07-aviso-hogar", "PUBL-07-turno", "PUBL-08-turno", "PUBL-08-turno-pronto", "REV-01", "SHT-ACTOR", "TUR-01", "TabBar", "VER-02", "VER-02-dorso", "VER-02-frente", "VER-02-selfie"];
for (const k in v) { const x = v[k]; if (typeof x === 'string' && /^[A-Za-z][\w-]*\.dc\.html$/.test(x) && !P.includes(x.slice(0, -8))) v[k] = undefined; }
return v;
}
_rv() {
const tema = this.props.tema ?? 'light';
const sufijo = tema === 'dark' ? '-oscuro' : '';
const f2 = (this.props.fase ?? 'F1') === 'F2';
const base = String(this.props.elegidas ?? '').split(',').filter(Boolean);
const st = this.state || {};
const sel = st.sel ?? base;
const d = String(this.props.desplazar ?? '0');
const v = { tema, f2, desplazar: d + 'px',
  appbarCls: 'tl-appbar tl-appbar--standard' + (d !== '0' ? ' is-scrolled' : ''),
  barCls: 'tl-ctabar' + (d === '0' ? ' is-scrolled' : ''),
  bServicios: true, bServiciosTxt: 'Reservas desde junio', bClases: !f2, bClasesTxt: 'Reservas desde marzo' };
const keys = ['empleo', 'turnos', 'servicios', 'clases', 'empresa', 'hogar', 'aprender'];
keys.forEach((k) => {
  const on = sel.includes(k);
  v['on_' + k] = on;
  v['cls_' + k] = 'tl-option' + (on ? ' is-selected' : '');
  v['tg_' + k] = () => this.setState({ sel: on ? sel.filter((x) => x !== k) : sel.concat(k) });
});
const bloques = new Set(sel.map((k) => ({ empleo: 'trabajo', turnos: 'trabajo' })[k] || k));
const hay = sel.length > 0;
v.ctaCls = 'tl-btn tl-btn--primary tl-btn--lg tl-btn--block' + (hay ? '' : ' is-disabled');
v.ctaDis = hay ? undefined : 'true';
// Con un solo bloque se va a «Tus datos» de la persona del ejemplo de ese bloque.
const datos = { empresa: 'ONB-03-rosa', hogar: 'ONB-03-carolina', clases: 'ONB-03-camila', servicios: 'ONB-03-luis', aprender: 'ONB-03-carolina-f2' }[[...bloques][0]] || 'ONB-03';
v.rCta = !hay ? undefined : (bloques.size > 1 ? 'ONB-02' + sufijo + '.dc.html' : datos + sufijo + '.dc.html');
return v;
}
}
</script>
