<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>ONB-03 · Tus datos</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/talently/tokens.css">
<link rel="stylesheet" href="ds/talently/components/bundle.css">
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div data-theme="{{tema}}" class="tl-steplayout" style="position: relative; width: 390px; height: 844px; display: flex; flex-direction: column; overflow: hidden; background: var(--color-bg); color: var(--color-text); font-family: var(--font-sans);">
<header class="tl-appbar tl-appbar--standard"><div class="tl-statusbar"><span>13:00</span><span></span></div><div class="tl-appbar__row"><div><a class="tl-iconbtn tl-backbtn" href="{{rVolver}}" aria-label="Volver"><span class="tl-icon" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"><g stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M19.5 12H4.5M10.5 6l-6 6 6 6"></path></g></svg></span></a></div><h1 class="tl-appbar__title h3">{{pasoTxt}}</h1><div class="tl-appbar__actions"><button type="button" class="tl-iconbtn" aria-label="Opciones del registro"><span class="tl-icon" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"><g stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></g><circle cx="6" cy="12" r="1.7" fill="currentColor"></circle><circle cx="12" cy="12" r="1.7" fill="currentColor"></circle><circle cx="18" cy="12" r="1.7" fill="currentColor"></circle></svg></span></button></div></div></header>
<div class="tl-progress" role="progressbar" aria-valuemin="0" aria-valuemax="{{pasoMax}}" aria-valuenow="1" aria-label="{{pasoTxt}}"><div class="tl-progress__bar" style="width: {{pasoPct}};"></div></div>
<main class="tl-steplayout__body">
<h1 class="tl-steplayout__title h1">Tus datos</h1>
<p class="tl-steplayout__sub">Lo básico para armar tu perfil.</p>
<div style="display: flex; flex-direction: column; gap: 16px;">
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px;"><div class="tl-field"><label class="tl-field__label" for="o3-nombre">Nombre</label><div class="tl-field__control"><input class="tl-field__input" id="o3-nombre" value="{{nombre}}" placeholder="" autocomplete="given-name" inputmode="text"></div></div><div class="tl-field"><label class="tl-field__label" for="o3-apellido">Apellido</label><div class="tl-field__control"><input class="tl-field__input" id="o3-apellido" value="{{apellido}}" placeholder="" autocomplete="family-name" inputmode="text"></div></div></div>
<div class="tl-field tl-select"><span class="tl-field__label" id="o3-comuna-l">Comuna</span><a class="tl-field__control tl-select__control" href="{{rComuna}}" aria-haspopup="dialog" aria-labelledby="o3-comuna-l o3-comuna-v" style="text-decoration: none;"><span id="o3-comuna-v" style="display: contents;"><span class="{{comunaCls}}">{{comunaTxt}}</span></span><span class="tl-icon" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"><g stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m5.5 9.5 6.5 6.5 6.5-6.5"></path></g></svg></span></a></div>
<div><span class="tl-field__label">Foto <span class="tl-field__opt">(opcional)</span></span><div style="display: flex; align-items: center; gap: 16px; margin-top: 8px;"><span class="tl-upload-avatar"><span class="tl-upload-avatar__ph"><span class="tl-icon" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"><g stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="7.4" r="3.4"></circle><path d="M5 20c.75-4 3.1-6 7-6s6.25 2 7 6"></path></g><circle cx="12" cy="7.4" r="1.15" fill="currentColor" fill-opacity=".5"></circle></svg></span></span><button type="button" class="tl-iconbtn tl-iconbtn--tonal" aria-label="Agregar foto"><span class="tl-icon" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"><g stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4.6 7.6h2.9l1.6-2.6h5.8l1.6 2.6h2.9A1.6 1.6 0 0 1 21 9.2v9.2a1.6 1.6 0 0 1-1.6 1.6H4.6A1.6 1.6 0 0 1 3 18.4V9.2a1.6 1.6 0 0 1 1.6-1.6Z"></path><circle cx="12" cy="13.4" r="3.6"></circle></g><circle cx="12" cy="13.4" r="1.5" fill="currentColor" fill-opacity=".35"></circle></svg></span></button></span><div style="display: flex; flex-direction: column; gap: 8px;"><button type="button" class="tl-btn tl-btn--outline"><span class="tl-btn__label">Tomar foto</span></button><button type="button" class="tl-btn tl-btn--outline"><span class="tl-btn__label">Elegir de la galería</span></button></div></div><div class="tl-field__foot"><span class="tl-field__help">{{fotoAyuda}}</span></div></div>
<sc-if value="{{pideNac}}" hint-placeholder-val="{{true}}"><div class="{{edadCls}}"><label class="tl-field__label" for="o3-nac">Fecha de nacimiento</label><div class="tl-field__control"><input class="tl-field__input" id="o3-nac" value="{{nacimiento}}" placeholder="DD/MM/AAAA" autocomplete="bday" inputmode="numeric" aria-describedby="o3-nac-h o3-nac-e" aria-invalid="{{edadInv}}"></div><div class="tl-field__foot"><span class="tl-field__help" id="o3-nac-h">Es privada, no se muestra.</span><span class="tl-field__error" id="o3-nac-e"><span class="tl-icon tl-icon--16" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"><g stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10.3 4.5a2 2 0 0 1 3.4 0l7 12.2a2 2 0 0 1-1.7 3H5a2 2 0 0 1-1.7-3l7-12.2Z"></path><path d="M12 9.6v4"></path><path stroke-width="2.6" d="M12 16.7h.01"></path></g></svg></span><span>{{edadTxt}}</span></span></div></div></sc-if>
<div class="tl-field"><label class="tl-field__label" for="o3-tel">Teléfono <span class="tl-field__opt">(opcional)</span></label><div class="tl-field__control"><span class="tl-field__affix" aria-hidden="true">+56 9</span><input class="tl-field__input" id="o3-tel" value="{{telefono}}" placeholder="1234 5678" autocomplete="tel-national" inputmode="tel" aria-describedby="o3-tel-h"></div><div class="tl-field__foot"><span class="tl-field__help" id="o3-tel-h">Te lo pediremos verificado cuando tomes tu primer turno o publiques.</span></div></div>
</div>
</main>
<div class="tl-ctabar is-scrolled"><a class="tl-btn tl-btn--primary tl-btn--lg tl-btn--block" href="{{rCta}}" style="text-decoration: none;"><span class="tl-btn__label">Continuar</span></a></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"tema":{"editor":"enum","options":["light","dark"],"default":"light"},"estado":{"editor":"enum","options":["lista","errorEdad"],"default":"lista"},"comuna":{"editor":"text","default":""},"vacia":{"editor":"boolean","default":false},"persona":{"editor":"enum","options":["jorge","rosa","camila","luis","carolina","carolinaF2"],"default":"jorge"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const v = this._rv();
v.rVolver = 'ONB-01.dc.html';
const P = ["ACT-02", "ACT-02-desplazado", "ACT-02-jorge", "AUTH-01", "AUTH-02", "AUTH-03", "AUTH-08", "AUTH-08-codigo", "CFG-01", "CFG-01-cerrar-sesion", "DET-01-empleo", "DET-01-turno", "DET-01-turno--f9", "DET-01-turno-postulado", "DET-02", "DET-02-exito", "DET-03", "EXP-01", "EXP-01-lista", "EXP-02", "EXP-02-turnos-desplazado", "EXP-02-turnos-desplazado--f9", "FALTA-ACT-02-matias", "FALTA-DET-01-pedro", "FALTA-INI-01-rosa", "FALTA-MSG-01-marta", "GES-01-turno", "GES-02-hogar", "GES-04", "GES-04-postulados", "GES-04-sin-postulados", "INDICE-F1", "INI-01-carolina", "INI-01-jorge-nuevo", "INI-01-salir", "INI-02", "INI-02--f7", "INI-02-cambio", "MSG-01", "MSG-01-jorge", "MSG-02", "MSG-02b-adjuntar", "MSG-02b-compartir", "MSG-02b-familia", "MSG-02b-marta", "MSG-02b-no-disponible", "MSG-02b-pedido", "Main", "Main--f9", "NOT-01", "ONB-01", "ONB-03", "ONB-99", "ONB-T1", "ONB-T2", "ONB-T3", "ONB-T4", "ONB-T5", "PRC-01", "PRC-01-hogar", "PRF-01", "PRF-01--f11", "PRF-01-final", "PRF-12", "PRF-12-avisado", "PRF-12-desde-act", "PUBL-01", "PUBL-01-carolina", "PUBL-03-paso1", "PUBL-03-paso2", "PUBL-03-paso3", "PUBL-03-paso4", "PUBL-04-identidad", "PUBL-04-paso1", "PUBL-04-paso2", "PUBL-04-paso3", "PUBL-04-paso4", "PUBL-04-paso5", "PUBL-07-aviso-hogar", "PUBL-07-turno", "PUBL-08-turno", "PUBL-08-turno-pronto", "REV-01", "SHT-ACTOR", "TUR-01", "TabBar", "VER-02", "VER-02-dorso", "VER-02-frente", "VER-02-selfie"];
for (const k in v) { const x = v[k]; if (typeof x === 'string' && /^[A-Za-z][\w-]*\.dc\.html$/.test(x) && !P.includes(x.slice(0, -8))) v[k] = undefined; }
return v;
}
_rv() {
const tema = this.props.tema ?? 'light';
const sufijo = tema === 'dark' ? '-oscuro' : '';
const estado = this.props.estado ?? 'lista';
// Persona del ejemplo: la fecha de nacimiento solo se pide si eligió algo de «Quiero trabajar».
const P = {
  jorge: { nombre: 'Jorge', apellido: 'Muñoz', comuna: 'Puente Alto', n: 6, nac: true, fecha: '14/05/1985', volver: 'ONB-01-jorge', sigue: 'ONB-T1',
    foto: 'Una foto donde se vea tu cara ayuda a que te elijan.' },
  rosa: { nombre: 'Rosa', apellido: 'Muñoz', comuna: 'San Miguel', n: 5, nac: false, volver: 'ONB-01', sigue: 'ONB-O1',
    foto: 'Así te reconocen las personas que contrates.' },
  camila: { nombre: 'Camila', apellido: 'Fuentes', comuna: 'Ñuñoa', n: 6, nac: true, fecha: '22/08/1997', volver: 'ONB-01-camila', sigue: 'ONB-K1',
    foto: 'La necesitarás para publicar.' },
  luis: { nombre: 'Luis', apellido: 'Contreras', comuna: 'La Cisterna', n: 6, nac: true, fecha: '03/09/1974', volver: 'ONB-01', sigue: 'ONB-S1',
    foto: 'La necesitarás para publicar.' },
  carolinaF2: { nombre: 'Carolina', apellido: 'Soto', comuna: 'Ñuñoa', n: 3, nac: false, volver: 'ONB-01-carolina-f2', sigue: 'ONB-A1',
    foto: 'Así te reconocen tus profesores.' },
  carolina: { nombre: 'Carolina', apellido: 'Soto', comuna: 'Ñuñoa', n: 2, nac: false, volver: 'ONB-01-carolina', sigue: 'ONB-H1',
    foto: 'Así te reconocen las personas que contrates.' }
}[this.props.persona ?? 'jorge'];
const vacia = String(this.props.vacia ?? 'false') === 'true';
const comuna = vacia ? '' : (this.props.comuna || P.comuna);
const err = estado === 'errorEdad';
return { tema, nombre: P.nombre, apellido: P.apellido, telefono: '', pideNac: P.nac, fotoAyuda: P.foto,
  pasoTxt: 'Paso 1 de ' + P.n, pasoMax: String(P.n), pasoPct: Math.round(100 / P.n) + '%',
  comunaTxt: comuna || 'Elige tu comuna', comunaCls: comuna ? 'tl-select__value' : 'tl-select__value is-placeholder',
  nacimiento: err ? '14/05/2015' : P.fecha,
  edadCls: err ? 'tl-field is-error' : 'tl-field', edadInv: err ? 'true' : undefined,
  edadTxt: 'Debes tener 18 años o más para ofrecer trabajo, servicios o clases',
  rVolver: P.volver + sufijo + '.dc.html', rComuna: 'SHT-COMUNA' + sufijo + '.dc.html', rCta: err ? undefined : P.sigue + sufijo + '.dc.html' };
}
}
</script>
</body>
</html>
