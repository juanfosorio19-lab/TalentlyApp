<head>

<title>Íconos de interfaz</title>
<style>
  html, body { margin:0; background:var(--color-bg); }
  .ds { display:grid; grid-template-columns:1fr 1fr; font-family:var(--font-sans); }
  .ds-panel { background:var(--color-bg); color:var(--color-text); padding:var(--space-6); min-width:0; }
  .ds-theme { display:flex; align-items:center; gap:var(--space-2); margin:0 0 var(--space-4); color:var(--color-text-2); }
  .ds-theme i { width:12px; height:12px; border-radius:var(--radius-full); border:1px solid var(--color-border-strong); background:var(--color-surface); }
  .ds-sec { margin:var(--space-6) 0 var(--space-3); color:var(--color-text-2); }
  .ds-sec:first-of-type { margin-top:0; }
  .mono { font-variant-numeric: tabular-nums; }
  .g { display:inline-flex; align-items:center; height:20px; padding:0 var(--space-2); border-radius:var(--radius-full); font-size:11px; line-height:16px; font-weight:600; white-space:nowrap; vertical-align:1px; margin-left:var(--space-1); }
  .g.ok   { background:var(--color-success-subtle); color:var(--color-success-text); }
  .g.bad  { background:var(--color-danger-subtle);  color:var(--color-danger-text); }
  .g.warn { background:var(--color-warning-subtle); color:var(--color-warning-text); }
  .g.mute { background:var(--color-surface-2);      color:var(--color-text-2); }

  .legend { display:flex; gap:var(--space-4); margin:0 0 var(--space-4); font-size:12px; line-height:16px; font-weight:500; color:var(--color-text-2); }
  .legend span { display:inline-flex; align-items:center; gap:var(--space-1); }
  .legend i { width:12px; height:12px; border-radius:var(--radius-full); }
  .isec { margin:var(--space-6) 0 var(--space-3); color:var(--color-text-2); }
  .isec:first-of-type { margin-top:0; }
  .igrid { display:grid; grid-template-columns:repeat(3, 1fr); gap:var(--space-3); }
  .ic { background:var(--color-surface); border:1px solid var(--color-border); border-radius:var(--radius-md); padding:var(--space-3); min-width:0; position:relative; }
  .ic.hl { border:1.5px solid var(--color-primary-text); }
  .ic-row { display:flex; gap:var(--space-3); margin-bottom:var(--space-2); }
  .ic-row span { display:inline-flex; width:24px; height:24px; }
  .ic-row svg { width:24px; height:24px; display:block; }
  .ic-n { font-size:12px; line-height:16px; font-weight:600; color:var(--color-text); }
  .ic-u { font-size:12px; line-height:16px; font-weight:500; color:var(--color-text-3); margin-top:2px; }
  .ic-t { margin-top:var(--space-2); }
  .ic .g { margin-left:0; }

</style>
</head>
